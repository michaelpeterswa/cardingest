---
openapi: 3.0.3
info:
  title: cardingest API
  version: "1.0.0"
  description: >
    HTTP API for the cardingest SD/CFexpress ingest appliance. All routes are
    versioned under /api/v1. This contract is the source of truth; Go handlers
    and types are generated from it with oapi-codegen (`make generate`).

servers:
  - url: /

paths:
  /api/v1/healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/status:
    get:
      operationId: getStatus
      summary: Live per-slot ingest state.
      responses:
        "200":
          description: Current slot states.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlotState"

  /api/v1/jobs:
    get:
      operationId: getJobs
      summary: Recent ingest jobs, newest first.
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Job history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /api/v1/stats:
    get:
      operationId: getStats
      summary: Aggregate ingest statistics.
      responses:
        "200":
          description: Stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /api/v1/config:
    get:
      operationId: getConfig
      summary: Current policy config as YAML.
      responses:
        "200":
          description: Config document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDoc"
    put:
      operationId: putConfig
      summary: Replace the policy config (validated before saving).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigDoc"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDoc"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/dev/insert:
    post:
      operationId: devInsert
      summary: Simulate inserting a card (mock reader mode only).
      description: >
        Reports the directory `dir` as a card present in `slot`. Only available
        when the process runs with READER_MODE=mock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertRequest"
      responses:
        "202":
          description: Insertion accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The slot is already occupied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not running in mock mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/dev/remove:
    post:
      operationId: devRemove
      summary: Simulate removing a card (mock reader mode only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveRequest"
      responses:
        "202":
          description: Removal accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The slot is empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not running in mock mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  responses:
    BadRequest:
      description: The request body was invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    InsertRequest:
      type: object
      required: [slot]
      properties:
        slot:
          type: string
          description: Reader slot identifier, e.g. "A".
          example: A
        dir:
          type: string
          description: >
            Directory to present as the card's contents. Defaults to
            <MOCK_FIXTURE_DIR>/<slot> when omitted.

    RemoveRequest:
      type: object
      required: [slot]
      properties:
        slot:
          type: string
          example: A

    Accepted:
      type: object
      required: [status, slot]
      properties:
        status:
          type: string
          example: accepted
        slot:
          type: string
          example: A

    SlotState:
      type: object
      required: [slot, state]
      properties:
        slot:
          type: string
        state:
          type: string
          description: idle | ingesting
        jobId:
          type: integer
          format: int64

    Job:
      type: object
      required: [id, slot, serial, status, startedAt]
      properties:
        id:
          type: integer
          format: int64
        slot:
          type: string
        serial:
          type: string
        status:
          type: string
          description: running | complete | error
        copied:
          type: integer
        deduped:
          type: integer
        skipped:
          type: integer
        erased:
          type: integer
        bytes:
          type: integer
          format: int64
        error:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time

    Stats:
      type: object
      required: [totalJobs, completeJobs, errorJobs, filesCopied, bytes]
      properties:
        totalJobs:
          type: integer
        completeJobs:
          type: integer
        errorJobs:
          type: integer
        filesCopied:
          type: integer
        bytes:
          type: integer
          format: int64

    ConfigDoc:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
          description: The policy config as YAML text.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
