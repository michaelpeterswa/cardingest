---
# cardingest ingest policy. Hot-editable (the web UI round-trips this file).
# Bootstrap settings (READER_MODE, paths, ports) come from env, not here.

destination:
  # Default share for categories that don't set their own dest. Layout tokens:
  # {category} {year} {month} {day} {date}(=YYYY-MM-DD).
  path: /data/dest
  layout: "{category}/{year}/{date}"   # e.g. jpeg/2026/2026-07-04/…
  date_source: exif_then_mtime
  # Sentinel that must exist on each share for ingest to proceed. Create it
  # once per share (touch it on the mounted share). See deploy/DEPLOY.md.
  marker: .cardingest-ok

# Per-category routing. A category may override dest/layout/marker; otherwise it
# inherits the destination above. RAW goes to the Lightroom share in Lightroom's
# nested date layout; everything else lands on the default share.
categories:
  raw:
    ext: [".arw", ".dng", ".cr2", ".cr3", ".nef"]
    dest: /data/lightroom      # bind-mounted Lightroom SMB share
    layout: "{year}/{date}"    # -> lightroom/2026/2026-07-04/GUH09283.ARW
  jpeg: [".jpg", ".jpeg"]      # -> /data/dest/jpeg/2026/2026-07-04/…
  video: [".mp4", ".mov"]
  other: ["*"]                 # catch-all; omit to skip unknowns

rules:                          # ordered, first match wins
  - name: skip thumbnails
    match:
      ext: [".thm"]
      path_glob: "**/THMBNL/**"
    action: skip
  - name: skip tiny files
    match:
      max_size: 100KB
    action: skip
  - name: keep media
    match:
      ext:
        - ".arw"
        - ".dng"
        - ".cr2"
        - ".cr3"
        - ".nef"
        - ".jpg"
        - ".jpeg"
        - ".mp4"
        - ".mov"
    action: keep
  - default: skip

card:
  erase_ingested: true
  erase_skipped: false          # opt-in; off to avoid rule-typo data loss
  eject_when_done: true

reader:
  # Lexar RW530 dual-slot reader. Each slot is a separate USB mass-storage
  # bridge, so both VID:PIDs are allowlisted. Confirm on the appliance with
  # lsusb / sysfs once a card is inserted.
  usb_ids:
    - "05e3:0764"               # SD slot (Genesys bridge)
    - "174c:2362"               # CFexpress slot (ASMedia bridge, UAS)

notify:
  # pulsar-notification-pipeline writer. The bearer token is NOT stored here;
  # it is read from the env var named by token_env (see NOTIFY_PULSAR_TOKEN).
  - type: pulsar
    url: http://writer:8080
    user_key: "REPLACE_WITH_30CHAR_PUSHOVER_KEY"
    priority: 0
    token_env: NOTIFY_PULSAR_TOKEN
    "on": [complete, error]
