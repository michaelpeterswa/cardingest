---
# Production appliance deployment. Runs the real Linux detector + mounter.
# The host mounts the NAS share and bind-mounts it in; /dev is bound whole so
# hotplugged card device nodes (absent at container start) must be visible.
services:
  cardingest:
    image: cardingest:latest
    build: .
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN                     # mount/umount inside the container
    security_opt:
      - apparmor:unconfined
    environment:
      READER_MODE: "real"
      LOG_LEVEL: "info"
      CONFIG_PATH: "/config/config.yaml"
      STATE_PATH: "/state/cardingest.db"
      MOUNT_ROOT: "/run/cardingest/mnt"
      HTTP_PORT: "8080"
      METRICS_ENABLED: "true"
      METRICS_PORT: "8081"
      # Bearer token for the pulsar notification writer (see config notify).
      NOTIFY_PULSAR_TOKEN: "${NOTIFY_PULSAR_TOKEN:-}"
    volumes:
      - /dev:/dev  # hotplugged sdX nodes must be visible
      # One bind per destination share (see config categories.*.dest). Each is
      # its own host mount + marker file (deploy/DEPLOY.md).
      - /mnt/nas/ingest:/data/dest          # default share (jpeg/video/other)
      - /mnt/nas/lightroom:/data/lightroom  # RAW share
      - ./config:/config
      - ./state:/state                     # SQLite: jobs, files, hash index
    ports:
      - "8080:8080"
